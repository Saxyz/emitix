spring:
  application:
    name: emitix

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/emitix}
    username: ${DB_USERNAME:emitix}
    password: ${DB_PASSWORD:emitix}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  mail:
    from: ${MAIL_FROM:noreply@emitix.co}
    enabled: ${MAIL_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:PPp27xSTfBwOpRn4/AV6gPzQSnQg+Oi80KdWfCcuAHs=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  invoice:
    prefix: ${INVOICE_PREFIX:FE-}
    tax-rate: ${INVOICE_TAX_RATE:19.00}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    com.unimag.emitix: DEBUG
    org.springframework.security: WARN
